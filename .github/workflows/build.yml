---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit-yii2-22:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    with:
      # Distinct concurrency groups: both legs call the same reusable workflow, and its
      # default group (workflow + ref) would make the later-starting leg cancel the other.
      concurrency-group: build-22-${{ github.ref }}
      extensions: fileinfo
      php-version: '["8.3","8.4","8.5"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The reusable workflow resolves dependencies before the hook runs, so the 2.0 leg
  # re-pins yiisoft/yii2 and updates once more to test against the stable branch.
  phpunit-yii2-20:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@4873e17a5d41412f13a94a616bc9d4b7eb66b93b # v2.0.3
    with:
      concurrency-group: build-20-${{ github.ref }}
      extensions: fileinfo
      php-version: '["8.3","8.4","8.5"]'
      hook: "composer require 'yiisoft/yii2:^2.0.45' --no-update && composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader"
